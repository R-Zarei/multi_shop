{% extends 'base.html' %}
{% load static %}

{% block title %}Payment{% endblock %}

{% block body %}
<div class="container-fluid">
    <div class="row px-xl-5">
        <div class="col-12 text-center mt-5">
            <!-- error picture -->
            <img src="{% static 'gif/Payment Success.gif' %}" alt="Payment Error"
                 style="max-width: 300px;" class="mb-4">

            <!-- message -->
            <h2 class="text-success font-weight-bold">Payment Success</h2>

            <p class="lead text-muted mb-4">{{ message }}</p>

            <!-- buttons -->
            <div class="d-flex justify-content-center gap-3">
{#                <a href="{% url 'cart:checkout' %}" class="btn btn-primary px-4 py-2 mr-2">#}
{#                    Try Again#}
{#                </a>#}
                <a href="{% url 'account:orders' %}" class="btn btn-primary px-4 py-2 mr-2">
                    Order
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
