{% extends 'product/products_list_base.html' %}

{% block filter_box_top_margin %}135{% endblock %}

{% block breadcrumb %}
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="{% url 'home' %}">Home</a>
                    <a class="breadcrumb-item text-dark" href="#">Shop</a>
                    <span class="breadcrumb-item active">Shop List</span>
                </nav>
            </div>
        </div>
    </div>
{% endblock %}

<!-- Shop Start -->
{% block banner %}
    <div class="brand-section bg-light p-4 mb-4" style="border-radius: 1px; border: 1px solid #dee2e6;">
        <div class="d-flex align-items-end">
            <div class="brand-logo-wrapper"
                 style="width: 60px; height: 60px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #dee2e6; background-color: #fff;">
                <img src="{{ brand.logo.url }}" alt="{{ brand.name }}"
                     style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <div class="ml-3" style="display: flex; flex-direction: column; justify-content: flex-end;">
                            <span class="brand-name-link"
                                  style="font-size: 1.1rem; font-weight: 600; color: #333; text-decoration: none; text-transform: uppercase; transition: color 0.2s;">
                                {{ brand.name }}
                            </span>
                <span style="font-size: 0.8rem; color: #6c757d; font-weight: 400; letter-spacing: 0.3px;">
                                Products registered with this brand
                            </span>
            </div>
        </div>
    </div>
{% endblock %}
<!-- Shop End -->
