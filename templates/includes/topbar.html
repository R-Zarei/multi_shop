<div class="container-fluid">
    <div class="row bg-secondary py-1 px-xl-5">
        <div class="col-lg-6 d-none d-lg-block">
            <div class="d-inline-flex align-items-center h-100">
                <a class="text-body mr-3" href="">About</a>
                <a class="text-body mr-3" href="">Contact</a>
                <a class="text-body mr-3" href="">Help</a>
                <a class="text-body mr-3" href="">FAQs</a>
            </div>
        </div>
        <div class="col-lg-6 text-center text-lg-right">
            <div class="d-inline-flex align-items-center">
                <div class="btn-group">
                    {% if request.user.is_authenticated %}
                        <button type="button" class="btn btn-sm btn-light dropdown-toggle"
                                data-toggle="dropdown">{{ request.user.full_name }}</button>
                        <div class="dropdown-menu dropdown-menu-right">
                            <a href="{% url 'account:profile' %}">
                                <button class="dropdown-item" type="button">Profile</button>
                            </a>
                            <a href="{% url 'account:logout' %}">
                                <button class="dropdown-item" type="button">Sign out</button>
                            </a>
                        </div>
                    {% else %}
                        <button type="button" class="btn btn-sm btn-light dropdown-toggle"
                                data-toggle="dropdown">My Account
                        </button>
                        <div class="dropdown-menu dropdown-menu-right">
                            <a href="{% url 'account:login' %}">
                                <button class="dropdown-item" type="button">Sign in</button>
                            </a>
                            <a href="{% url 'account:register' %}">
                                <button class="dropdown-item" type="button">Sign up</button>
                            </a>
                        </div>
                    {% endif %}
                </div>
            </div>
            <div class="d-inline-flex align-items-center d-block d-lg-none">
                <a href="" class="btn px-0 ml-2">
                    <i class="fas fa-heart text-dark"></i>
                    <span class="badge text-dark border border-dark rounded-circle"
                          style="padding-bottom: 2px;">0</span>
                </a>
                <a href="" class="btn px-0 ml-2">
                    <i class="fas fa-shopping-cart text-dark"></i>
                    <span class="badge text-dark border border-dark rounded-circle"
                          style="padding-bottom: 2px;">0</span>
                </a>
            </div>
        </div>
    </div>
    <div class="row align-items-center bg-light py-3 px-xl-5 d-none d-lg-flex">
        <div class="col-lg-4">
            <a href="{% url 'home' %}" class="text-decoration-none">
                <span class="h1 text-uppercase text-primary bg-dark px-2">Multi</span>
                <span class="h1 text-uppercase text-dark bg-primary px-2 ml-n1">Shop</span>
            </a>
        </div>

<div class="col-lg-4 col-6 text-left">
    <div class="search-wrapper">
        <!-- Search Form -->
        <form action="" method="GET" class="search-form" id="searchForm">
            <div class="input-group">
                <input type="text"
                       class="form-control search-input"
                       id="searchInput"
                       placeholder="Search for products..."
                       autocomplete="off"
                       aria-label="Search">
                <div class="input-group-append">
                    <button class="btn search-btn" type="button" id="searchToggle">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
            </div>

            <!-- ====== Search Dropdown Panel ====== -->
            <div class="search-dropdown" id="searchDropdown">
                <!-- Search Results Section -->
                <div class="search-results" id="searchResults">

                    <!-- Tags Section -->
                    <div class="search-section">
                        <h6 class="search-section-title">Popular Tags</h6>
                        <div class="search-tags">
                            <span class="search-tag">#5G</span>
                            <span class="search-tag">#AI</span>
                            <span class="search-tag">#OLED</span>
                            <span class="search-tag">#Gaming</span>
                            <span class="search-tag">#Flagship</span>
                        </div>
                    </div>

                    <!-- View All Results Button -->
                    <div class="search-footer">
                        <a href="#" class="search-view-all">
                            View all results
                            <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                </div>

                <!-- Pre-Search Suggestions  Section -->
                <div class="search-results" id="perSearch">

                    <!-- Tags Section -->
                    <div class="search-section">
                        <h6 class="search-section-title">Popular Tags</h6>
                        <div class="search-tags">
                            <span class="search-tag">#5G</span>
                            <span class="search-tag">#AI</span>
                            <span class="search-tag">#OLED</span>
                            <span class="search-tag">#Gaming</span>
                            <span class="search-tag">#Flagship</span>
                        </div>
                    </div>
                </div>

                <!-- Loading Section -->
                <div class="search-loading" id="searchLoading" style="display: none;">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="sr-only">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">Searching...</p>
                    </div>
                </div>

                <!-- Empty Results Section -->
                <div class="search-empty" id="searchEmpty" style="display: none;">
                    <div class="text-center py-4">
                        <i class="fas fa-search fa-2x text-muted mb-2"></i>
                        <p class="text-muted">No results found</p>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<!-- ====== End Search Section ====== -->
